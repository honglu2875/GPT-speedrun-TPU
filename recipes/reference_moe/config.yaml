# Versioned model-family definition for recipes/reference/train.py.
#
# A tier selects a complete architecture. Profiles select execution budgets and
# kernels; smoke deliberately remains a tiny inline wiring test. The family uses
# the Complete(d)P width/depth rules described in docs/COMPLETEP.md.
schema_version: 2
family:
  default_tier: 125m
  parameterization:
    name: complete_d_p
    base_width: 384
    base_depth: 12
    depth_alpha: 1.0
    init_std: 0.02
    # Match the official nanoGPT-mup implementation: each head contracts over
    # its own fixed 64-wide q/k coordinate, independent of the number of heads.
    attention_scale: inverse_head_dim
    embeddings: untied
  tiers:
    60m:
      parameters: 59918208
      model:
        layers: 12
        heads: 6
        d_model: 384
        mlp_mult: 4
        experts: 8
        expert_top_k: 2
        expert_mult: 2
        router_aux_coefficient: 0.01
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    125m:
      parameters: 123456640
      model:
        layers: 12
        heads: 10
        d_model: 640
        mlp_mult: 4
        experts: 8
        expert_top_k: 2
        expert_mult: 2
        router_aux_coefficient: 0.01
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    250m:
      parameters: 244444032
      model:
        layers: 16
        heads: 14
        d_model: 896
        mlp_mult: 4
        experts: 8
        expert_top_k: 2
        expert_mult: 2
        router_aux_coefficient: 0.01
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    500m:
      parameters: 502602240
      model:
        layers: 19
        heads: 20
        d_model: 1280
        mlp_mult: 4
        experts: 8
        expert_top_k: 2
        expert_mult: 2
        router_aux_coefficient: 0.01
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    1b:
      parameters: 989943808
      model:
        layers: 21
        heads: 28
        d_model: 1792
        mlp_mult: 4
        experts: 8
        expert_top_k: 2
        expert_mult: 2
        router_aux_coefficient: 0.01
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304

profiles:
  smoke:
    training:
      steps: 2
      batch_size: 4
      seq_len: 32
      sampling: random_windows
      dtype: float32
    model:
      layers: 2
      heads: 2
      d_model: 64
      mlp_mult: 4
      normalization: rms_norm
      position_encoding: rope_base_10000
      mlp_activation: gelu
      vocab_size: 256
      semantic_vocab_size: 256
    kernels:
      attention_backend: dense
      loss_backend: dense
      vocab_tile_size: 2048
    optimizer:
      learning_rate: 0.0003
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 1
      val_every: 0
      val_probe_batches: 1
    logging:
      diagnostics_every: 0
      log_every: 10

  dev:
    training:
      steps: 100
      batch_size: 16
      seq_len: 8192
      sampling: shuffled_epochs
      dtype: bfloat16
    model: family_tier
    kernels:
      attention_backend: tpu_flash
      loss_backend: tiled
      vocab_tile_size: 2048
      document_masking: true
    optimizer:
      # 2^-8, the optimum measured by the Complete(d)P learning-rate sweep at
      # 60M/125M and by both depth ablations. See docs/HYPERPARAMETER_TRANSFER.md.
      learning_rate: 0.00390625
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 8
      val_every: 0
      val_probe_batches: 8
    logging:
      diagnostics_every: 10
      log_every: 10

  official:
    training:
      tokens_per_parameter: 20.0
      batch_size: 16
      seq_len: 8192
      sampling: shuffled_epochs
      dtype: bfloat16
    model: family_tier
    kernels:
      attention_backend: tpu_flash
      loss_backend: tiled
      vocab_tile_size: 2048
      document_masking: true
    optimizer:
      # 2^-8, the optimum measured by the Complete(d)P learning-rate sweep at
      # 60M/125M and by both depth ablations. See docs/HYPERPARAMETER_TRANSFER.md.
      learning_rate: 0.00390625
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 80
      val_every: 500
      val_probe_batches: 8
    logging:
      diagnostics_every: 500
      log_every: 500
