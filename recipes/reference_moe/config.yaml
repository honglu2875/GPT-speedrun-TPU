# Versioned model-family definition for recipes/reference_moe/train.py.
#
# A tier supplies the dimensions that vary along the size ladder; architecture
# holds the family invariants. Profiles select execution budgets and kernels,
# while smoke deliberately remains a complete tiny inline wiring test. The
# family uses the fixed-TPP CompleteP hybrid described in docs/COMPLETEP.md.
schema_version: 5
family:
  default_tier: 125m
  # Keep the fork aligned with reference while retaining the routed recipe's
  # native 8k default. Either named context remains selectable on demand.
  default_context: 8k
  contexts:
    1k:
      seq_len: 1024
      reference_batch_size: 128
      document_masking: false
    8k:
      seq_len: 8192
      reference_batch_size: 16
      document_masking: true
  parameterization:
    name: completep_fixed_tpp_v1
    base_tier: 60m
    base_width: 384
    base_depth: 12
    depth_alpha: 1.0
    init_std: 0.02
    # Match the official nanoGPT-mup implementation: each head contracts over
    # its own fixed 64-wide q/k coordinate, independent of the number of heads.
    attention_scale: inverse_head_dim
    embeddings: untied
  architecture:
    mlp_mult: 4
    experts: 8
    expert_top_k: 2
    expert_mult: 2
    router_aux_coefficient: 0.01
    normalization: rms_norm
    position_encoding: rope_base_10000
    mlp_activation: gelu
    vocab_size: 50304
    semantic_vocab_size: 50304
  tiers:
    60m:
      layers: 12
      heads: 6
      d_model: 384
    125m:
      layers: 12
      heads: 10
      d_model: 640
    250m:
      layers: 16
      heads: 14
      d_model: 896
    500m:
      layers: 19
      heads: 20
      d_model: 1280
    1b:
      layers: 21
      heads: 28
      d_model: 1792

profiles:
  smoke:
    training:
      steps: 2
      batch_size: 4
      seq_len: 32
      sampling: random_windows
      dtype: float32
    model:
      layers: 2
      heads: 2
      d_model: 64
      mlp_mult: 4
      # Routing stays on in the smoke profile: a profile block replaces the
      # tier's model wholesale, so omitting these silently made the fast
      # self-check run a dense model and never touch the routed path at all.
      # 4 x 32 x top_k = 256 rows, a multiple of the grouped matmul's 128 tile.
      experts: 8
      expert_top_k: 2
      expert_mult: 2
      router_aux_coefficient: 0.01
      normalization: rms_norm
      position_encoding: rope_base_10000
      mlp_activation: gelu
      vocab_size: 256
      semantic_vocab_size: 256
    kernels:
      attention_backend: dense
      loss_backend: dense
      vocab_tile_size: 2048
    optimizer:
      learning_rate: 0.0003
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 1
      val_every: 0
      val_probe_batches: 1
    logging:
      diagnostics_every: 0
      log_every: 10

  dev:
    training:
      tokens_per_parameter: 5.0
      sampling: shuffled_epochs
      dtype: bfloat16
    model: family_tier
    kernels:
      attention_backend: tpu_flash
      loss_backend: tiled
      vocab_tile_size: 2048
    optimizer:
      # 2^-8, the optimum measured by the fixed-TPP learning-rate sweep at
      # 60M/125M and by both depth ablations. See docs/HYPERPARAMETER_TRANSFER.md.
      learning_rate: 0.00390625
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 8
      val_every: 0
      val_probe_batches: 8
    logging:
      diagnostics_every: 10
      log_every: 10

  official:
    training:
      tokens_per_parameter: 20.0
      sampling: shuffled_epochs
      dtype: bfloat16
    model: family_tier
    kernels:
      attention_backend: tpu_flash
      loss_backend: tiled
      vocab_tile_size: 2048
    optimizer:
      # 2^-8, the optimum measured by the fixed-TPP learning-rate sweep at
      # 60M/125M and by both depth ablations. See docs/HYPERPARAMETER_TRANSFER.md.
      learning_rate: 0.00390625
      min_lr_ratio: 0.1
      warmup_ratio: 0.1
      weight_decay: 0.1
      adam_epsilon: 1.0e-8
      beta1: 0.9
      beta2: 0.95
      grad_clip: 0.0
    evaluation:
      eval_batches: 80
      val_every: 500
      val_probe_batches: 8
    logging:
      diagnostics_every: 500
      log_every: 500
