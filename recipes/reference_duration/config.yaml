# Canonical official configuration for recipes/reference_duration/train.py.
#
# This complete standalone experiment applies Complete(d)P's token-duration
# factor relative to a 5-TPP anchor.
schema_version: 5
execution_type: official
family:
  default_tier: 125m
  # A context preset is a coupled training contract: sequence length, the
  # recipe-local batch anchor used by m_B, and the document-attention policy.
  default_context: 1k
  contexts:
    1k:
      seq_len: 1024
      reference_batch_size: 128
      document_masking: false
    8k:
      seq_len: 8192
      reference_batch_size: 16
      document_masking: true
  parameterization:
    name: completedp_duration_v1
    base_tier: 60m
    base_width: 384
    base_depth: 12
    base_tokens_per_parameter: 5.0
    depth_alpha: 1.0
    init_std: 0.02
    # Match the official nanoGPT-mup implementation: each head contracts over
    # its own fixed 64-wide q/k coordinate, independent of the number of heads.
    attention_scale: inverse_head_dim
    embeddings: untied
  tiers:
    60m:
      model:
        layers: 12
        heads: 6
        d_model: 384
        mlp_mult: 4
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    125m:
      model:
        layers: 12
        heads: 10
        d_model: 640
        mlp_mult: 4
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    250m:
      model:
        layers: 16
        heads: 14
        d_model: 896
        mlp_mult: 4
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    500m:
      model:
        layers: 19
        heads: 20
        d_model: 1280
        mlp_mult: 4
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304
    1b:
      model:
        layers: 21
        heads: 28
        d_model: 1792
        mlp_mult: 4
        normalization: rms_norm
        position_encoding: rope_base_10000
        mlp_activation: gelu
        vocab_size: 50304
        semantic_vocab_size: 50304

run:
  training:
    duration:
      tokens_per_parameter: 20.0
    sampling: shuffled_epochs
    dtype: bfloat16
  kernels:
    attention_backend: tpu_flash
    loss_backend: tiled
    vocab_tile_size: 2048
  optimizer:
    learning_rate: 0.00390625
    min_lr_ratio: 0.1
    warmup_ratio: 0.1
    weight_decay: 0.1
    adam_epsilon: 1.0e-8
    beta1: 0.9
    beta2: 0.95
    grad_clip: 0.0
  evaluation:
    prediction_budget: 10485760
    eval_batches: 80
    val_every: 500
    val_probe_batches: 8
  logging:
    diagnostics_every: 500
    log_every: 500
