[project]
name = "gpt-speedrun-tpu"
version = "0.1.0"
description = "A single-file GPT training speedrun and competition harness for TPU v4-8"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "jax[tpu]==0.11.0",
]

[project.scripts]
speedrun = "speedrun.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedrun", "harness"]

[tool.uv]
package = true
required-version = ">=0.11.0"
