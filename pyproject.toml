[project]
name = "rig"
version = "0.1.0"
description = "A single-entry GPT training rig and harness for Cloud TPU v4 slices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "jax[tpu]==0.11.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
rig = "rig.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rig"]

[tool.uv]
package = true
required-version = ">=0.11.0"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with failure-prone syntax/name errors. The research recipes intentionally
# expose imports for clone-and-hack workflows, so broad style rules are not a gate.
select = ["E9", "F63", "F7", "F82"]
