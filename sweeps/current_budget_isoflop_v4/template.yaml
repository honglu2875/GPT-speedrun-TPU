# Generator template for diagnostic sweep configs. `speedrun.scaling` replaces
# the dev profile in every materialized config and preserves the smoke/official
# guards byte-semantically. Actual resolved configs live beside each run.
schema_version: 1
profiles:
  smoke:
    training:
      steps: 2
      batch_size: 4
      seq_len: 32
      sampling: random_windows
      dtype: float32
    model:
      layers: 2
      heads: 2
      d_model: 64
      mlp_mult: 4
      vocab_size: 256
      semantic_vocab_size: 256
    kernels:
      attention_backend: dense
      loss_backend: dense
      vocab_tile_size: 2048
    optimizer:
      learning_rate: 0.0003
      min_lr_ratio: 0.1
      warmup_steps: 1
      weight_decay: 0.1
      beta1: 0.9
      beta2: 0.95
      grad_clip: 1.0
    evaluation:
      eval_batches: 1
      val_every: 0
      val_probe_batches: 1
    logging:
      diagnostics_every: 0
      log_every: 10

